<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نقابات قمر</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@600;900&display=swap');

 :root {
    --gold: #d4af37;
    --mythic: #c0392b;

    --primary: #4a463f; /* لون نص غامق ناعم */

    --glass: rgba(255, 255, 255, 0.65);
    --border: rgba(0, 0, 0, 0.08);

    /* أصفر فاتح مائل للأبيض (قمر) */
    --bg-main: #fff9e6;
    --bg-dark: #f3ecd4;
}


*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body {
    font-family: 'Cairo', sans-serif;
    background: linear-gradient(
        180deg,
        var(--bg-main),
        var(--bg-dark)
    );
    color: var(--primary);
    min-height: 100vh;
    overflow-x: hidden;
    padding-top: 80px;
}



/* ===== NAV ===== */
.nav-container {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    z-index: 999;

    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 18px 6%;

    background: rgba(255, 252, 235, 0.85);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);

    border-bottom: 1px solid rgba(212,175,55,0.35);
}


.menu-item {
    color: #5a5246;
    text-decoration: none;
    font-size: 14px;
    font-weight: 600;
    transition: 0.3s;
}

.menu-item:hover {
    color: var(--gold);
    text-shadow: 0 0 6px rgba(212,175,55,0.5);
}


/* ===== TITLE ===== */
.main-title{
    text-align:center;
    margin:60px auto 40px;
    font-size:32px;
    color:#ddd;
    border-right:5px solid var(--gold);
    padding-right:15px;
    width:fit-content;
}

/* ===== GRID ===== */
.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
    gap:30px;
    padding:0 6% 80px;
}

/* ===== CARD ===== */
.card{
    position:relative;
    height:260px;
    border-radius:22px;
    overflow:hidden;

    background:
      linear-gradient(to bottom,rgba(0,0,0,0.25),rgba(0,0,0,0.85)),
      var(--bg) center/cover no-repeat;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;

    border:1px solid var(--border);
    box-shadow:0 20px 40px rgba(0,0,0,0.6);
    transition:0.5s ease;
}

.card:hover{
    transform:translateY(-10px);
    box-shadow:0 0 40px rgba(255,215,0,0.35);
}

/* ===== ADMIRAL LABEL ===== */
.rank{
    position:absolute;
    top:18px;
    right:18px;

    font-size:11px;
    letter-spacing:2px;
    padding:6px 14px;

    color:#4c1d95; /* بنفسجي غامق */
    border:1px solid #6d28d9;
    border-radius:20px;

    background:rgba(20,10,40,0.75);
    backdrop-filter:blur(6px);
    box-shadow:0 0 12px rgba(124,58,237,0.6);
    z-index:2;
}

/* ===== TEXT ===== */
.card h3{
    font-size:26px;
    margin-bottom:10px;

    color:#d4af37; /* ذهبي */
    font-weight:900;
    text-shadow:
        0 0 10px rgba(212,175,55,0.6),
        0 0 20px rgba(212,175,55,0.3);
}
.card:hover h3{
    text-shadow:
        0 0 15px rgba(255,215,0,0.9),
        0 0 30px rgba(255,215,0,0.6);
}

.card:hover .rank{
    box-shadow:0 0 18px rgba(124,58,237,0.9);
}


.icon{
    font-size:28px;
}

/* ===== SPECIAL ===== */
.mother{
    border:2px solid var(--gold);
    box-shadow:0 0 50px rgba(255,215,0,0.6);
}

.developer-badge {
            position: fixed;
            bottom: 20px;
            left: 20px;
            /* يمكنك تغييرها إلى right إذا أردت */
            background: rgba(15, 23, 42, 0.6);
            /* زجاجي داكن */
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 242, 254, 0.2);
            padding: 8px 15px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 9999;
            transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            text-decoration: none;
        }

        .developer-badge:hover {
            transform: translateY(-5px) scale(1.05);
            border-color: #00f2fe;
            box-shadow: 0 5px 15px rgba(0, 242, 254, 0.2);
            background: rgba(15, 23, 42, 0.9);
        }

        .developer-badge .text {
            font-family: 'Cinzel', serif;
            /* أو أي خط تفضله */
            font-size: 11px;
            color: #fff;
            letter-spacing: 1.5px;
            font-weight: bold;
        }

        .developer-badge .code-icon {
            color: #00f2fe;
            font-weight: 900;
            font-family: monospace;
            font-size: 14px;
            animation: blink 2s infinite;
        }
</style>
</head>
