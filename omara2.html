<style>
:root {
    --main-bg: #9bdcff;   /* اللون لي بغيتي */
    --white-soft: #ffffff;
    --border-soft: rgba(0, 0, 0, 0.08);
}


        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
    font-family: 'Cairo', sans-serif;
    background: linear-gradient(
        180deg,
        #bfe9ff,
        #9bdcff
    );
    color: #0f172a;
    min-height: 100vh;
    overflow-x: hidden;
    padding-top: 80px;
}

/* NAV */
  .nav-container {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    z-index: 999;

    display: flex;
    justify-content: center;
    align-items: center;
    padding: 14px 6%;

    background: rgba(155, 220, 255, 0.85);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);

    border-bottom: 1px solid rgba(0, 0, 0, 0.08);
}




       .epic-menu {
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
    justify-content: center;
}


/* الروابط */
.menu-item {
    position: relative;
    padding: 10px 18px;

    background: linear-gradient(135deg, #9bdcff, #5bbcff);
    color: #0f172a;

    font-size: 13px;
    font-weight: 800;
    text-decoration: none;
    border-radius: 999px;

    box-shadow: 0 6px 16px rgba(91,188,255,0.35);
    transition: all 0.3s ease;
}


.menu-item:hover {
    background: linear-gradient(135deg, #5bbcff, #2fa4ff);
    color: #ffffff;
    transform: translateY(-2px);
    box-shadow: 0 10px 22px rgba(47,164,255,0.5);
}



/* خط سفلي أنيق */
.menu-item::after {
    content: "";
    position: absolute;
    left: 0;
    bottom: -4px;
    width: 0%;
    height: 2px;
    background: linear-gradient(90deg, #9bdcff, #5bbcff);
    transition: 0.3s ease;
    border-radius: 10px;
}



.menu-item:hover::after {
    width: 100%;
}

    @media (max-width: 768px) {
    .menu-item {
        padding: 9px 14px;
        font-size: 12px;
    }

    .epic-menu {
        gap: 10px;
    }
}
/* دخول الأنمي للـ nav */
.nav-container {
    animation: navDrop 0.9s ease forwards;
    transform: translateY(-40px);
    opacity: 0;
}

@keyframes navDrop {
    to {
        transform: translateY(0);
        opacity: 1;
    }
}

/* Animation stagger للأزرار */
.menu-item {
    animation: buttonPop 0.6s ease forwards;
    opacity: 0;
    transform: scale(0.8);
}

.menu-item:nth-child(1) { animation-delay: 0.2s; }
.menu-item:nth-child(2) { animation-delay: 0.3s; }
.menu-item:nth-child(3) { animation-delay: 0.4s; }
.menu-item:nth-child(4) { animation-delay: 0.5s; }
.menu-item:nth-child(5) { animation-delay: 0.6s; }
.menu-item:nth-child(6) { animation-delay: 0.7s; }

@keyframes buttonPop {
    to {
        opacity: 1;
        transform: scale(1);
    }
}
    
        


/* HEADER */
.hero{
    text-align:center;
    padding:70px 6% 40px;
    animation:fadeDown 1s ease;
}
.hero h1{
    font-size:2.6rem;
    text-shadow:0 0 15px rgba(245,200,106,.6);
}
.hero p{opacity:.7}

/* GRID */
.princes{
    max-width:1200px;
    margin:auto;
    padding:40px 6%;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:35px;
}

/* CARD */
.prince-card{
    position:relative;
    border-radius:22px;
    overflow:hidden;
    background:var(--glass);
    border:1px solid var(--border);
    box-shadow:0 20px 40px rgba(0,0,0,.15);
    animation:rise 1s ease forwards;
    opacity:0;
}

/* صورة الأمير */
.prince-card img{
    width:100%;
    height:260px;
    object-fit:cover;
    filter:brightness(.6);
}

/* overlay */
.prince-overlay{
    position:absolute;
    inset:0;
    background:linear-gradient(to bottom,transparent 30%,rgba(0,0,0,.85));
}

/* content */
.prince-content{
    position:absolute;
    bottom:20px;
    width:100%;
    text-align:center;
    color:#fff;
}
.prince-name{
    font-size:1.9rem;
    font-weight:900;
}
.symbols{
    margin-top:10px;
    font-size:1.3rem;
}

/* ألوان خاصة */
.obito{box-shadow:0 0 25px rgba(180,0,0,.6)}
.ozuki{box-shadow:0 0 25px rgba(0,80,160,.6)}
.inomaki{box-shadow:0 0 25px rgba(120,0,160,.6)}

footer{
    text-align:center;
    padding:30px;
    font-size:12px;
    opacity:.6;
}

/* ANIMATIONS */
@keyframes fadeDown{
    from{opacity:0;transform:translateY(-40px)}
    to{opacity:1;transform:translateY(0)}
}
@keyframes rise{
    from{opacity:0;transform:translateY(40px)}
    to{opacity:1;transform:translateY(0)}
}
.theme-toggle {
    margin-left: 16px;
    padding: 10px 14px;

    border-radius: 50%;
    border: none;
    cursor: pointer;

    font-size: 16px;
    background: #ffffff;
    color: #0f172a;

    box-shadow: 0 6px 14px rgba(0,0,0,0.15);
    transition: all 0.3s ease;
}

.theme-toggle:hover {
    transform: rotate(20deg) scale(1.1);
}
/* الوضع النهاري */
body.light {
    background: linear-gradient(180deg, #fff9ef, #f6f1e8);

/* nav نهار */
body.light .nav-container {

/* أزرار نهار */
body.light .menu-item {

}

/* Footer نهار */
body.light .footer {
    background: rgba(255, 248, 235, 0.8);
}
